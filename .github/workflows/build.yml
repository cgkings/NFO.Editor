name: Build PySide6 Windows Release

on:
  push:
    branches:
      - main
      - master
      - QT6
      - qt6
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  build-windows:
    name: Build five EXEs with one shared PySide6 runtime
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      build_name: ${{ steps.package.outputs.build_name }}
      zip_name: ${{ steps.package.outputs.zip_name }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Show selected ref and checked-out revision
        shell: pwsh
        run: |
          Write-Host "event_name = ${{ github.event_name }}"
          Write-Host "github.ref = ${{ github.ref }}"
          Write-Host "github.ref_name = ${{ github.ref_name }}"
          Write-Host "github.sha = ${{ github.sha }}"
          git rev-parse --show-toplevel
          git rev-parse HEAD
          git branch --show-current
          git status --short

      - name: Validate exact repository paths
        shell: pwsh
        run: |
          $requiredFiles = @(
            "nfo_editor.py",
            "nfo_editor_ui.py",
            "nfo_editor_events.py",
            "nfo_utils.py",
            "cg_crop.py",
            "cg_dedupe.py",
            "cg_photo_wall.py",
            "cg_rename.py",
            "requirements.txt",
            "requirements-build.txt",
            "scripts/qt_source_smoke.py"
          )

          $trackedFiles = @(git ls-files | ForEach-Object { $_.Replace("\", "/") })
          $wrongCaseOrMissing = @(
            $requiredFiles | Where-Object { -not ($trackedFiles -ccontains $_) }
          )

          if ($wrongCaseOrMissing.Count -gt 0) {
            Write-Host "Tracked files with similar spelling:"
            foreach ($expected in $wrongCaseOrMissing) {
              $leaf = Split-Path -Leaf $expected
              $trackedFiles |
                Where-Object { (Split-Path -Leaf $_) -ieq $leaf } |
                ForEach-Object { Write-Host "  actual: $_" }
            }

            Write-Error (
              "Required files are missing or use incorrect filename casing:`n - " +
              ($wrongCaseOrMissing -join "`n - ")
            )
            throw "Fix the source paths, commit, and push again."
          }

          $rootNames = @(Get-ChildItem -Force | ForEach-Object { $_.Name })
          if (-not ($rootNames -ccontains "img")) {
            $actualImg = $rootNames | Where-Object { $_ -ieq "img" }
            Write-Error "Expected directory exactly 'img'; actual match: $actualImg"
            throw "Directory filename casing is incorrect."
          }

          Write-Host "All required paths and filename casing are correct."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-build.txt
          python -m pip check
          python -c "import PySide6, qfluentwidgets, PyInstaller; print('PySide6:', PySide6.__version__); print('PyInstaller:', PyInstaller.__version__)"

      - name: Reject legacy Qt bindings
        shell: pwsh
        run: |
          @'
          import importlib.util

          forbidden = ("PyQt5", "PyQt6", "PySide2")
          found = [name for name in forbidden if importlib.util.find_spec(name) is not None]
          if found:
              raise SystemExit(f"Legacy/foreign Qt bindings installed: {', '.join(found)}")
          print("Only the PySide6 Qt binding is installed.")
          '@ | python -

      - name: Compile and run unit tests
        shell: pwsh
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -q

          $lintFiles = @(
            "nfo_editor.py",
            "nfo_editor_ui.py",
            "nfo_editor_events.py",
            "nfo_utils.py",
            "cg_crop.py",
            "cg_dedupe.py",
            "cg_photo_wall.py",
            "cg_rename.py"
          )
          $lintFiles += Get-ChildItem tests -Filter "*.py" -File | ForEach-Object { $_.FullName }
          $lintFiles += Get-ChildItem scripts -Filter "*.py" -File | ForEach-Object { $_.FullName }
          python -m pyflakes @lintFiles

      - name: Run source Qt startup smoke test
        shell: pwsh
        run: |
          python scripts/qt_source_smoke.py

      - name: Resolve package name
        id: package
        shell: pwsh
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)

          if ("${{ github.ref_type }}" -eq "tag") {
            $buildName = "${{ github.ref_name }}"
          }
          else {
            $buildName = "dev-${{ github.run_number }}-$shortSha"
          }

          $zipName = "NFOTools-$buildName-windows-x64.zip"
          $artifactName = "NFOTools-$buildName-windows-x64"

          "BUILD_NAME=$buildName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "build_name=$buildName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Generate shared-runtime PyInstaller spec
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "build" -Force | Out-Null

          @'
          # -*- mode: python ; coding: utf-8 -*-

          from __future__ import annotations

          import os


          ROOT = os.path.abspath(os.path.join(os.path.dirname(SPEC), ".."))


          def source(name):
              return os.path.join(ROOT, name)


          def optional_datas():
              items = []

              for filename in (
                  "chuizi.ico",
                  "cg_crop.ico",
                  "cg_dedupe.ico",
                  "cg_photo_wall.ico",
                  "mapping_actor.xml",
                  "series_mapping.xml",
              ):
                  path = source(filename)
                  if os.path.isfile(path):
                      items.append((path, "."))

              image_dir = source("img")
              if os.path.isdir(image_dir):
                  items.append((image_dir, "img"))

              return items


          EXCLUDES = [
              "PyQt5",
              "PyQt6",
              "PySide2",
              "numpy",
              "scipy",
              "matplotlib",
              "IPython",
              "pytest",
              "tkinter",
              "jedi",
          ]


          MAIN_HIDDEN_IMPORTS = [
              "qfluentwidgets",
              "PIL",
              "PIL.Image",
              "PIL._imaging",
              "bs4",
              "lxml",
              "requests",
              "winshell",
              "win32api",
              "win32com",
              "win32com.client",
              "win32com.shell",
              "win32com.shell.shellcon",
              "pythoncom",
              "pywintypes",
              "win32wnet",
              "nfo_utils",
              "cg_crop",
              "cg_rename",
              "cg_photo_wall",
              "cg_dedupe",
          ]


          def make_analysis(script_name, hiddenimports=None, datas=None):
              return Analysis(
                  [source(script_name)],
                  pathex=[ROOT],
                  binaries=[],
                  datas=datas or [],
                  hiddenimports=hiddenimports or [],
                  hookspath=[],
                  hooksconfig={},
                  runtime_hooks=[],
                  excludes=EXCLUDES,
                  noarchive=False,
                  optimize=1,
              )


          main_a = make_analysis(
              "nfo_editor.py",
              hiddenimports=MAIN_HIDDEN_IMPORTS,
              datas=optional_datas(),
          )
          crop_a = make_analysis(
              "cg_crop.py",
              hiddenimports=["nfo_utils"],
          )
          rename_a = make_analysis(
              "cg_rename.py",
              hiddenimports=["nfo_utils"],
          )
          dedupe_a = make_analysis(
              "cg_dedupe.py",
              hiddenimports=["nfo_utils"],
          )
          photo_a = make_analysis(
              "cg_photo_wall.py",
              hiddenimports=["nfo_utils"],
          )


          def make_exe(analysis, name, icon_name=None):
              pyz = PYZ(analysis.pure)

              icon_path = None
              if icon_name:
                  candidate = source(icon_name)
                  if os.path.isfile(candidate):
                      icon_path = candidate

              return EXE(
                  pyz,
                  analysis.scripts,
                  [],
                  exclude_binaries=True,
                  name=name,
                  debug=False,
                  bootloader_ignore_signals=False,
                  strip=False,
                  upx=False,
                  console=False,
                  icon=icon_path,
              )


          main_exe = make_exe(main_a, "NFOEditor", "chuizi.ico")
          crop_exe = make_exe(crop_a, "cg_crop", "cg_crop.ico")
          rename_exe = make_exe(rename_a, "cg_rename", "chuizi.ico")
          dedupe_exe = make_exe(dedupe_a, "cg_dedupe", "cg_dedupe.ico")
          photo_exe = make_exe(photo_a, "cg_photo_wall", "cg_photo_wall.ico")


          # One shared COLLECT produces five EXEs beside one shared _internal folder.
          coll = COLLECT(
              main_exe,
              crop_exe,
              rename_exe,
              dedupe_exe,
              photo_exe,

              main_a.binaries,
              main_a.datas,

              crop_a.binaries,
              crop_a.datas,

              rename_a.binaries,
              rename_a.datas,

              dedupe_a.binaries,
              dedupe_a.datas,

              photo_a.binaries,
              photo_a.datas,

              strip=False,
              upx=False,
              upx_exclude=[],
              name="NFOTools",
          )
          '@ | Set-Content -Path "build/shared_runtime.spec" -Encoding utf8

          Write-Host "Generated build/shared_runtime.spec"
          Get-Content "build/shared_runtime.spec"

      - name: Build five EXEs with one shared runtime
        shell: pwsh
        run: |
          Remove-Item "dist" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "build/pyinstaller-shared" -Recurse -Force -ErrorAction SilentlyContinue

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --distpath "dist" `
            --workpath "build/pyinstaller-shared" `
            "build/shared_runtime.spec"

          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller shared-runtime build failed."
          }

          $outputRoot = "dist/NFOTools"
          if (-not (Test-Path $outputRoot -PathType Container)) {
            throw "Shared-runtime output directory was not produced: $outputRoot"
          }

          $documentationFiles = Get-ChildItem . -File | Where-Object {
            $_.Name -like "README*.md" -or
            $_.Name -like "CHANGELOG*.md" -or
            $_.Name -in @(
              "ROUND2_DEBUG_REPORT.md",
              "FIX_REPORT_QT6.md",
              "BUILD_GITHUB_ACTIONS.md"
            )
          }

          foreach ($doc in $documentationFiles) {
            Copy-Item $doc.FullName $outputRoot -Force
          }

          Write-Host "Shared-runtime build completed:"
          Get-ChildItem $outputRoot -Force

      - name: Validate shared runtime and launch all EXEs
        shell: pwsh
        run: |
          $root = (Resolve-Path "dist/NFOTools").Path
          $internal = Join-Path $root "_internal"

          if (-not (Test-Path $internal -PathType Container)) {
            throw "The shared _internal runtime directory is missing."
          }

          $exeNames = @(
            "NFOEditor.exe",
            "cg_crop.exe",
            "cg_rename.exe",
            "cg_dedupe.exe",
            "cg_photo_wall.exe"
          )

          foreach ($exeName in $exeNames) {
            $exePath = Join-Path $root $exeName

            if (-not (Test-Path $exePath -PathType Leaf)) {
              throw "Missing executable: $exePath"
            }

            if ((Get-Item $exePath).Length -lt 100KB) {
              throw "Executable is unexpectedly small: $exePath"
            }

            Write-Host "[OK] $exeName"
          }

          if (Test-Path (Join-Path $root "tools")) {
            throw "Old per-tool runtime folders still exist. The shared build was not used."
          }

          $qwindows = @(
            Get-ChildItem $root -Recurse -File -Filter "qwindows.dll" -ErrorAction SilentlyContinue
          )
          if ($qwindows.Count -ne 1) {
            throw "Expected exactly one shared qwindows.dll, found $($qwindows.Count)."
          }

          $headlessPlugins = @(
            Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -in @("qoffscreen.dll", "qminimal.dll") }
          )
          if ($headlessPlugins.Count -lt 1) {
            throw "Qt offscreen/minimal platform plugin is missing."
          }

          $qtCoreFiles = @(
            Get-ChildItem $root -Recurse -File -Filter "Qt6Core.dll" -ErrorAction SilentlyContinue
          )
          if ($qtCoreFiles.Count -ne 1) {
            throw "Expected exactly one shared Qt6Core.dll, found $($qtCoreFiles.Count)."
          }

          $pythonDlls = @(
            Get-ChildItem $root -Recurse -File -Filter "python3*.dll" -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^python3\d+\.dll$' }
          )
          if ($pythonDlls.Count -ne 1) {
            throw "Expected exactly one shared Python runtime DLL, found $($pythonDlls.Count)."
          }

          $requiredResources = @(
            "mapping_actor.xml",
            "series_mapping.xml",
            "chuizi.ico"
          )
          foreach ($resource in $requiredResources) {
            $found = Get-ChildItem $root -Recurse -File -Filter $resource -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $found) {
              throw "Required resource is missing: $resource"
            }
          }

          foreach ($forbidden in @("PyQt5", "PyQt6", "PySide2")) {
            $found = Get-ChildItem $root -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like "*$forbidden*" } |
              Select-Object -First 1
            if ($found) {
              throw "Forbidden Qt binding content found: $($found.FullName)"
            }
          }

          $previousPlatform = $env:QT_QPA_PLATFORM
          $env:QT_QPA_PLATFORM = "offscreen"

          try {
            foreach ($exeName in $exeNames) {
              $exePath = Join-Path $root $exeName
              Write-Host "Starting frozen smoke test: $exeName"

              $process = Start-Process `
                -FilePath $exePath `
                -WorkingDirectory $root `
                -PassThru

              Start-Sleep -Seconds 6
              $process.Refresh()

              if ($process.HasExited) {
                throw "$exeName exited during startup smoke test with code $($process.ExitCode)."
              }

              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
              Write-Host "[OK] $exeName remained alive after startup."
            }
          }
          finally {
            $env:QT_QPA_PLATFORM = $previousPlatform
          }

          $allFiles = @(Get-ChildItem $root -Recurse -File)
          $totalBytes = ($allFiles | Measure-Object Length -Sum).Sum

          if ($totalBytes -lt 20MB) {
            throw "Artifact directory is unexpectedly small."
          }

          Write-Host "Shared-runtime validation passed."
          Write-Host "Files: $($allFiles.Count)"
          Write-Host "Uncompressed size: $([Math]::Round($totalBytes / 1MB, 2)) MB"
          Write-Host "qwindows.dll: $($qwindows[0].FullName)"
          Write-Host "Qt6Core.dll: $($qtCoreFiles[0].FullName)"
          Write-Host "Python runtime: $($pythonDlls[0].FullName)"

      - name: Create release archive and checksum
        shell: pwsh
        run: |
          if (Test-Path $env:ZIP_NAME) {
            Remove-Item $env:ZIP_NAME -Force
          }

          Compress-Archive `
            -Path "dist/NFOTools/*" `
            -DestinationPath $env:ZIP_NAME `
            -CompressionLevel Optimal

          $zipItem = Get-Item $env:ZIP_NAME
          if ($zipItem.Length -lt 1MB) {
            throw "Release archive is unexpectedly small."
          }

          $hash = (Get-FileHash -Algorithm SHA256 $env:ZIP_NAME).Hash.ToLowerInvariant()
          "$hash  $env:ZIP_NAME" |
            Set-Content -Path "$env:ZIP_NAME.sha256" -Encoding ascii

          Write-Host "Archive: $env:ZIP_NAME"
          Write-Host "Compressed size: $([Math]::Round($zipItem.Length / 1MB, 2)) MB"
          Write-Host "SHA-256: $hash"

      - name: Upload verified artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.zip_name }}
            ${{ steps.package.outputs.zip_name }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-windows.outputs.artifact_name }}
          path: release
          digest-mismatch: error

      - name: Publish or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          ZIP_NAME: ${{ needs.build-windows.outputs.zip_name }}
        run: |
          set -euo pipefail
          cd release

          test -s "$ZIP_NAME"
          test -s "$ZIP_NAME.sha256"
          sha256sum --check "$ZIP_NAME.sha256"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$ZIP_NAME" "$ZIP_NAME.sha256" --clobber
          else
            gh release create "$TAG_NAME" "$ZIP_NAME" "$ZIP_NAME.sha256" \
              --verify-tag \
              --generate-notes \
              --title "NFOTools $TAG_NAME"
          fi
